[build]
  publish = "public"
  functions = "netlify/functions"
  # 只修改 docs 等說明文件時不重新部署
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify public package.json netlify.toml"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# 公開資料接口：/api/news → netlify/functions/api.js
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?r=:splat"
  status = 200

# 每日提醒：UTC 01:00 即香港時間上午 9 時。想改時間，修改下面的 cron 表達式。
[functions."bot-cron"]
  schedule = "0 1 * * *"
